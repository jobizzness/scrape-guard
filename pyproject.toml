[project]
name = "scrape-guard"
version = "0.1.0"
description = "Detect scrapers that fail silently"
readme = "README.md"
license = "MIT"
authors = [
    { name = "jobizzness", email = "jobizzness@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.65.2",
]

[project.scripts]
scrape-guard = "scrape_guard.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
